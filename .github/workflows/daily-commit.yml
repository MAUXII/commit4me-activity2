name: commit4me daily

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daily contribution
        run: |
          git config user.name "Mauricio"
          git config user.email "115664412+MAUXII@users.noreply.github.com"
          MESSAGES=(
            "chore: daily contribution"
          )
          MAX=9
          COUNT=$(( (RANDOM % MAX) + 1 ))
          for i in $(seq 1 "$COUNT"); do
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)-$i" >> ACTIVITY.log
            git add ACTIVITY.log
            pick=$((RANDOM % ${#MESSAGES[@]}))
            MSG="${MESSAGES[$pick]}"
            git commit -m "$MSG ($i/$COUNT)" || true
          done
          git push
